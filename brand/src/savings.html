<!DOCTYPE html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
<style>
 *{margin:0;box-sizing:border-box}
 body{width:1080px;height:1080px;overflow:hidden;font-family:'Inter',sans-serif}
 .c{width:1080px;height:1080px;background:linear-gradient(135deg,#0f2742,#17436f);color:#fff;
    display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;position:relative;padding:0 90px}
 .bar{position:absolute;top:0;left:0;right:0;height:12px;background:#c2a14d}
 .eyebrow{font-size:26px;letter-spacing:5px;text-transform:uppercase;color:#c2a14d;font-weight:700;margin-bottom:34px}
 h1{font-family:'Playfair Display',serif;font-size:66px;font-weight:800;line-height:1.15;margin-bottom:54px}
 .row{display:flex;align-items:center;gap:34px;margin-bottom:22px}
 .old{font-size:40px;color:#9fb0c6;text-decoration:line-through;font-weight:600}
 .vs{font-size:26px;color:#8fa2ba}
 .new{font-family:'Playfair Display',serif;font-size:72px;color:#d8bd6e;font-weight:800}
 .save{margin-top:34px;background:rgba(194,161,77,.16);border:1px solid #c2a14d;border-radius:16px;
       padding:22px 40px;font-size:34px;font-weight:700;color:#e7d290}
 .foot{position:absolute;bottom:56px;font-size:26px;color:#c2a14d;font-weight:700;letter-spacing:1px}
</style></head><body>
<div class="c"><div class="bar"></div>
 <div class="eyebrow">On a $1.3M Eastside Home</div>
 <h1>Stop Paying a<br>2.5% Commission</h1>
 <div class="row"><span class="old">$32,500</span><span class="vs">vs</span><span class="new">$2,999</span></div>
 <div class="save">Keep $29,500+ at closing</div>
 <div class="foot">fairfeebuyer.com</div>
</div></body></html>
