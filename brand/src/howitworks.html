<!DOCTYPE html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
<style>
 *{margin:0;box-sizing:border-box}
 body{width:1080px;height:1080px;overflow:hidden;font-family:'Inter',sans-serif}
 .c{width:1080px;height:1080px;background:linear-gradient(135deg,#0f2742,#17436f);color:#fff;
    display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;padding:0 100px}
 .bar{position:absolute;top:0;left:0;right:0;height:12px;background:#c2a14d}
 .eyebrow{font-size:24px;letter-spacing:5px;text-transform:uppercase;color:#c2a14d;font-weight:700;margin-bottom:20px}
 h1{font-family:'Playfair Display',serif;font-size:62px;font-weight:800;margin-bottom:60px}
 .step{display:flex;align-items:center;gap:30px;margin-bottom:38px;width:100%}
 .num{flex-shrink:0;width:74px;height:74px;border:2px solid #c2a14d;border-radius:50%;
      display:flex;align-items:center;justify-content:center;font-family:'Playfair Display',serif;font-size:38px;color:#d8bd6e;font-weight:800}
 .txt{font-size:34px;font-weight:600}
 .txt small{display:block;font-size:22px;color:#c9d4e3;font-weight:400;margin-top:4px}
 .foot{position:absolute;bottom:56px;font-size:26px;color:#c2a14d;font-weight:700;letter-spacing:1px}
</style></head><body>
<div class="c"><div class="bar"></div>
 <div class="eyebrow">Simple &amp; Transparent</div>
 <h1>How It Works</h1>
 <div class="step"><div class="num">1</div><div class="txt">Reach out &amp; sign the agreement<small>Tell me the home you want</small></div></div>
 <div class="step"><div class="num">2</div><div class="txt">I write &amp; negotiate your offer<small>Competitive terms, expert strategy</small></div></div>
 <div class="step"><div class="num">3</div><div class="txt">Close &amp; get your keys<small>Full support to the finish line</small></div></div>
 <div class="foot">fairfeebuyer.com</div>
</div></body></html>
