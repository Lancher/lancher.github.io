<!DOCTYPE html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
<style>
 *{margin:0;box-sizing:border-box}
 body{width:1080px;height:1080px;overflow:hidden;font-family:'Inter',sans-serif}
 .c{width:1080px;height:1080px;background:#f5f7fa;color:#0f2742;
    display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;position:relative;padding:0 90px}
 .bar{position:absolute;top:0;left:0;right:0;height:12px;background:#c2a14d}
 svg{stroke:#0f2742;margin-bottom:26px}
 .eyebrow{font-size:24px;letter-spacing:5px;text-transform:uppercase;color:#8c6f24;font-weight:700;margin-bottom:20px}
 h1{font-family:'Playfair Display',serif;font-size:60px;font-weight:800;margin-bottom:44px}
 .cities{display:flex;flex-wrap:wrap;justify-content:center;gap:18px;max-width:820px}
 .chip{background:#fff;border:1.5px solid #d8e0ea;border-radius:40px;padding:16px 34px;font-size:30px;font-weight:600;color:#0f2742}
 .foot{position:absolute;bottom:56px;font-size:26px;color:#8c6f24;font-weight:700;letter-spacing:1px}
</style></head><body>
<div class="c"><div class="bar"></div>
 <svg width="72" height="72" viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>
 <div class="eyebrow">King County &amp; the Eastside</div>
 <h1>Where I Serve</h1>
 <div class="cities">
  <span class="chip">Seattle</span><span class="chip">Bellevue</span><span class="chip">Redmond</span>
  <span class="chip">Kirkland</span><span class="chip">Sammamish</span><span class="chip">Issaquah</span>
  <span class="chip">Bothell</span><span class="chip">Kenmore</span><span class="chip">Woodinville</span>
 </div>
 <div class="foot">fairfeebuyer.com</div>
</div></body></html>
