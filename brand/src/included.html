<!DOCTYPE html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
<style>
 *{margin:0;box-sizing:border-box}
 body{width:1080px;height:1080px;overflow:hidden;font-family:'Inter',sans-serif}
 .c{width:1080px;height:1080px;background:#f5f7fa;color:#0f2742;
    display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;padding:0 100px}
 .bar{position:absolute;top:0;left:0;right:0;height:12px;background:#c2a14d}
 .eyebrow{font-size:24px;letter-spacing:5px;text-transform:uppercase;color:#8c6f24;font-weight:700;margin-bottom:22px;text-align:center}
 h1{font-family:'Playfair Display',serif;font-size:60px;font-weight:800;margin-bottom:50px;text-align:center}
 .item{display:flex;align-items:center;gap:24px;font-size:36px;font-weight:600;margin-bottom:30px;width:100%}
 .item svg{flex-shrink:0;stroke:#0f2742}
 .price{margin-top:26px;font-family:'Playfair Display',serif;font-size:56px;color:#8c6f24;font-weight:800;text-align:center;width:100%}
 .foot{position:absolute;bottom:56px;font-size:26px;color:#8c6f24;font-weight:700;letter-spacing:1px}
</style></head><body>
<div class="c"><div class="bar"></div>
 <div class="eyebrow">All-Inclusive Buyer Service</div>
 <h1>What's Included</h1>
 <div class="item"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>Purchase offer writing</div>
 <div class="item"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>Contract review</div>
 <div class="item"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h13l-3.5-3.5"/><path d="M20 16H7l3.5 3.5"/></svg>Counter-offer negotiation</div>
 <div class="item"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="4" width="12" height="16" rx="2"/><path d="M9 4V3a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v1"/><path d="m9 13 2 2 4-4"/></svg>Full closing support</div>
 <div class="price">One flat fee &mdash; $2,999</div>
 <div class="foot">fairfeebuyer.com</div>
</div></body></html>
